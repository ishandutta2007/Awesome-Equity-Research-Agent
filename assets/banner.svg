<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0" />
      <stop offset="50%" stop-color="#374151" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <!-- Vertical Lines -->
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <!-- Horizontal Lines -->
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- High-tech Accents / Financial Chart Representation -->
  <path d="M -50 350 L 200 300 L 400 320 L 600 220 L 800 280 L 1000 150 L 1250 180 L 1250 450 L -50 450 Z" fill="url(#accent-cyan)" opacity="0.3" />
  <path d="M -50 350 L 200 300 L 400 320 L 600 220 L 800 280 L 1000 150 L 1250 180" fill="none" stroke="#06b6d4" stroke-width="4" filter="url(#glow)" />
  
  <path d="M -50 280 L 250 230 L 450 270 L 650 130 L 850 210 L 1050 80 L 1250 110" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.8" />

  <!-- Node Dots (Agents Representation) -->
  <circle cx="200" cy="300" r="6" fill="#06b6d4" />
  <circle cx="400" cy="320" r="6" fill="#06b6d4" />
  <circle cx="600" cy="220" r="8" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="800" cy="280" r="6" fill="#06b6d4" />
  <circle cx="1000" cy="150" r="10" fill="#ec4899" filter="url(#glow)" />

  <line x1="600" y1="220" x2="1000" y2="150" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="400" y1="320" x2="600" y2="220" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- Decorative Glowing Orb in Background -->
  <circle cx="950" cy="120" r="150" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="250" cy="280" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />

  <!-- Text Section -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="600" y="160" font-size="52" font-weight="900" text-anchor="middle" fill="url(#primary-grad)" letter-spacing="2">
      AWESOME EQUITY RESEARCH AGENTS
    </text>
    <!-- Subtitle -->
    <text x="600" y="215" font-size="20" font-weight="500" text-anchor="middle" fill="#9ca3af" letter-spacing="1">
      Autonomous AI Agents, Multi-Agent Orchestration &amp; Financial Intelligence
    </text>
    <!-- Badges / Tags on Banner -->
    <g transform="translate(600, 260)">
      <!-- Tag 1: Multi-Agent -->
      <rect x="-180" y="0" width="110" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="-125" y="19" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">Agentic RAG</text>

      <!-- Tag 2: Financial Workflows -->
      <rect x="-60" y="0" width="120" height="30" rx="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="19" font-size="12" font-weight="bold" fill="#8b5cf6" text-anchor="middle">Multi-Agent Systems</text>

      <!-- Tag 3: 2026 Ready -->
      <rect x="70" y="0" width="110" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="125" y="19" font-size="12" font-weight="bold" fill="#ec4899" text-anchor="middle">Market Intelligence</text>
    </g>
  </g>
</svg>
